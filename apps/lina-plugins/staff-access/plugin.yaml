id: staff-access
name: Staff Permissions
version: v0.1.6
type: source
distribution: builtin
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Reusable target-staff business eligibility and scoped qualification management.
author: linapro
license: Proprietary

i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

menus:
  - key: plugin:staff-access:management
    parent_key: iam
    name: Staff Permissions
    path: /system/staff-access
    component: system/plugin/dynamic-page
    perms: system:staff-access:list
    icon: lucide:user-round-check
    type: M
    sort: 40
    remark: Manage reusable target-staff business qualifications without changing host RBAC
  - key: plugin:staff-access:list
    parent_key: plugin:staff-access:management
    name: List Staff Permissions
    perms: system:staff-access:list
    type: B
    visible: 0
    sort: 1
  - key: plugin:staff-access:manage
    parent_key: plugin:staff-access:management
    name: Manage Staff Permissions
    perms: system:staff-access:manage
    type: B
    visible: 0
    sort: 2
