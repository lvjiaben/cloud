id: idc-resource
name: LinaPro IDC Resource
version: v0.1.77
type: source
distribution: builtin
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Provider accounts, capacity observations, server instances, allocation, and asynchronous resource operations for the IDC platform.
author: linapro
license: Proprietary

i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

dependencies:
  plugins:
    - id: vben-adapter
      version: "=0.1.0"
    - id: idc-core
      version: ">=0.1.171 <1.0.0"
business_extensions:
  - point: resource-provider
    version: v1
    role: owner
    owner: idc-resource
    methods:
      - connection.verify
      - capabilities.discover
      - configuration.candidates
      - catalog.products.list
      - catalog.products.detail
      - catalog.configuration.evaluate
      - catalog.billing-terms
      - provision.parameters.build
      - provider-capacity.list
      - operation.execute
      - task.query
      - resource.query
      - principal.lookup
      - principal.create
customer_surfaces:
  - key: purchased-services
    version: v1
    title: plugins.idc_resource.purchasedServices.title
    icon: lucide:server
    slot: customer.products
    route: purchased-services
    entry: customer/index.html
    bridge_capabilities: [purchased-services.customer.v1, native-server-facts.customer.v1]
    status: active
public_assets:
  - source: frontend/dist
    mount: /
menus:
  - key: plugin:idc-resource:provider-tools-shortcut
    parent_key: plugin:idc-core:resource-operations
    name: Supplier Operations
    path: /idc/resource/provider-tools
    component: system/plugin/dynamic-page
    perms: idc:admin:resource:overview:list
    icon: lucide:waypoints
    type: M
    is_cache: 0
    sort: 24
    remark: Shortcut to the operations tab of the existing supplier configuration page
  - key: plugin:idc-resource:server-management
    parent_key: plugin:idc-core:resource-operations
    name: Server Management
    icon: lucide:server-cog
    type: B
    visible: 0
    sort: 20
    remark: Permission-filtered server list and renewals; access inherited from existing child grants
  - key: plugin:idc-resource:provider-operations
    parent_key: plugin:idc-resource:provider-workspace
    name: Supplier Operations
    icon: lucide:cloud-cog
    type: B
    visible: 0
    sort: 29
    remark: Permission-filtered supplier overview, connections, operations, and available resources
  - key: plugin:idc-resource:provider-workspace
    parent_key: plugin:idc-core:resource-operations
    name: Server Provider Configuration
    path: /idc/resource/provider-configuration
    component: system/plugin/dynamic-page
    icon: lucide:cloud-cog
    type: M
    sort: 28
    remark: Server provider connector, credentials, channel lifecycle, and resource pools
  - key: plugin:idc-resource:provider-configuration
    parent_key: plugin:idc-resource:provider-workspace
    name: View Provider Configuration
    perms: idc:admin:resource:configuration:list
    type: B
    visible: 0
    sort: 0
  - key: plugin:idc-resource:provider-configuration:write
    parent_key: plugin:idc-resource:provider-configuration
    name: Manage Provider Configuration
    perms: idc:admin:resource:configuration:write
    type: B
    visible: 0
    sort: 1
  - key: plugin:idc-resource:overview
    parent_key: plugin:idc-resource:provider-operations
    name: Resource Overview
    perms: idc:admin:resource:overview:list
    icon: lucide:layout-dashboard
    type: B
    visible: 0
    sort: 29
    remark: Local resource pools, Provider capacity observations, finance, expiry, and task overview
  - key: plugin:idc-resource:provider-capacity
    parent_key: plugin:idc-resource:provider-operations
    name: Provider Capacity Observations
    perms: idc:admin:resource:provider-capacity:list
    icon: lucide:database-zap
    type: B
    visible: 0
    sort: 30
    remark: Provider capacity collection status; never creates or synchronizes generic product inventory
  - key: plugin:idc-resource:provider-capacity:refresh
    parent_key: plugin:idc-resource:provider-capacity
    name: Collect Provider Capacity
    perms: idc:admin:resource:provider-capacity:refresh
    type: B
    visible: 0
    sort: 1
  - key: plugin:idc-resource:health
    parent_key: plugin:idc-resource:provider-operations
    name: Provider Health
    perms: idc:admin:resource:health:list
    icon: lucide:activity
    type: B
    visible: 0
    sort: 31
    remark: Provider health signals, automatic write protection, and safe threshold policy
  - key: plugin:idc-resource:health:policy
    parent_key: plugin:idc-resource:health
    name: Update Health Policy
    perms: idc:admin:resource:health-policy:write
    type: B
    visible: 0
    sort: 1
  - key: plugin:idc-resource:tasks
    parent_key: plugin:idc-resource:provider-workspace
    name: Provider Tasks
    perms: idc:admin:resource:task:list
    icon: lucide:list-checks
    type: B
    visible: 0
    sort: 32
    remark: Bounded Provider task queue, redacted evidence, and safe manual takeover
  - key: plugin:idc-resource:api-logs
    parent_key: plugin:idc-resource:provider-workspace
    name: Provider API Logs
    perms: idc:admin:resource:api-log:list
    icon: lucide:file-clock
    type: B
    visible: 0
    sort: 33
    remark: Body-free local Provider invocation history
  - key: plugin:idc-resource:tasks:query
    parent_key: plugin:idc-resource:tasks
    name: View Provider Task Evidence
    perms: idc:admin:resource:task:query
    type: B
    visible: 0
    sort: 1
  - key: plugin:idc-resource:tasks:manual-takeover
    parent_key: plugin:idc-resource:tasks
    name: Take Over Provider Task
    perms: idc:admin:resource:task:manual-takeover
    type: B
    visible: 0
    sort: 2
  - key: plugin:idc-resource:channel-secret-manage
    parent_key: plugin:idc-core:resource-operations
    name: Manage Provider Channel Secrets
    perms: idc:admin:resource:channel-secret:manage
    type: B
    visible: 0
    sort: 99

  - key: plugin:idc-resource:server-accessories
    parent_key: plugin:idc-resource:server-management
    name: Server Management
    perms: idc:admin:resource:server-accessory:view
    icon: lucide:server-cog
    type: B
    visible: 0
    sort: 33
    remark: Server list, safe batch operations, and capability-driven accessory management
  - key: plugin:idc-resource:server-renewals
    parent_key: plugin:idc-resource:server-management
    name: Server Renewals
    perms: idc:admin:resource:server-batch:view
    icon: lucide:calendar-sync
    type: B
    visible: 0
    sort: 34
    remark: Preview and confirm renewals selected from resource-owned server entitlements
  - key: plugin:idc-resource:server-renewals:safe
    parent_key: plugin:idc-resource:server-renewals
