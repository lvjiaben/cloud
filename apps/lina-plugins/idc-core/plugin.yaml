id: idc-core
name: LinaPro IDC Core
version: v0.1.172
type: source
distribution: builtin
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Core customer, general catalog, commerce, support, and merchant-governance boundaries for the operations platform.
author: linapro
license: Proprietary

i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

dependencies:
  plugins:
    - id: vben-adapter
      version: "=0.1.0"
    - id: shared-services
      version: ">=0.1.1 <1.0.0"

business_extensions:
  - point: product-fulfillment
    version: v1
    role: owner
    owner: idc-core
    methods:
      - configuration.candidates
      - configuration.validate
      - product.configuration.validate
      - provision
      - query
      - renew
      - renew.query
      - peer.configuration.candidates
      - service.detail
      - service.sync
      - service.validation.update
      - service.revalidate
      - service.cancel
      - service.download

public_assets:
  - source: frontend/dist
    mount: /

menus:
  - key: plugin:idc-core:customer-sales
    name: Customer Business
    path: idc-customer-sales
    icon: lucide:users-round
    type: D
    sort: 4
    remark: Customers, agent pricing, sales commissions, and Open API
  - key: plugin:idc-core:catalog-products
    name: Catalog and Products
    path: idc-catalog-products
    icon: lucide:boxes
    type: D
    sort: 5
    remark: General product catalog and pricing workspaces
  - key: plugin:idc-core:resource-operations
    name: Servers and Resources
    path: idc-resource-operations
    icon: lucide:server-cog
    type: D
    sort: 6
    remark: Server, inventory, and provider operations
  - key: plugin:idc-core:orders-finance
    name: Orders and Finance
    path: idc-orders-finance
    icon: lucide:receipt-text
    type: D
    sort: 7
    remark: Orders, payments, reconciliation, and finance
  - key: plugin:idc-core:support-content
    name: Customer Support
    path: idc-support-content
    icon: lucide:messages-square
    type: D
    sort: 8
    remark: Tickets, support settings, and public content
  - key: plugin:idc-core:notification-marketing
    name: Notifications and Marketing
    path: idc-notification-marketing
    icon: lucide:megaphone
    type: D
    sort: 9
