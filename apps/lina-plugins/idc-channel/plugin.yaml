id: idc-channel
name: IDC Downstream Channel
version: v0.1.3
type: source
distribution: builtin
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Downstream access tokens, product publication, channel requests, compatibility adapters, and webhook delivery.
author: linapro
license: Proprietary
i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文
dependencies:
  plugins:
    - id: idc-core
      version: ">=0.1.0 <1.0.0"
    - id: vben-adapter
      version: "=0.1.0"

public_assets:
  - source: frontend/pages
    mount: /
    index: index.html

menus:
  - key: plugin:idc-channel:tokens
    parent_key: plugin:idc-core:customer-sales
    name: Open API
    path: /idc/channel
    component: system/plugin/dynamic-page
    perms: idc:admin:channel:token
    type: M
    sort: 90
    icon: lucide:network
    remark: Customer API credentials, interface permissions, and integration documentation

customer_surfaces:
  - key: open-platform
    version: v1
    title: plugin.idc-channel.workspace.platform.title
    icon: lucide:code
    slot: customer.products
    route: open-platform
    entry: customer/channel-tokens.vue
    status: active
