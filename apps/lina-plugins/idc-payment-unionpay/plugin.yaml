id: idc-payment-unionpay
name: 银联支付
version: v0.1.0
type: dynamic
distribution: managed
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: 中国银联 ACP 5.1.0 电脑与手机收银台配置，由 IDC Payment 统一管理支付事实。
author: linapro
license: Proprietary
dependencies:
  plugins:
    - id: idc-payment
      version: ">=0.1.7 <1.0.0"
business_extensions:
  - point: payment-method
    version: v1
    role: provider
    owner: idc-payment
    interface_configuration_cardinality: multiple
    interface_configuration:
      version: v1
      fields:
        - key: endpointOrigin
          type: single_line
          label: { en-US: UnionPay gateway URL, zh-CN: 银联接口地址 }
          required: true
          text_format: url
          maximum_length: 2048
        - key: merchantId
          type: single_line
          label: { en-US: Merchant ID, zh-CN: 银联商户号 }
          required: true
          maximum_length: 256
        - key: certificateSerialNo
          type: single_line
          label: { en-US: Signing certificate serial, zh-CN: 签名证书序列号 }
          required: true
          maximum_length: 256
        - key: privateKey
          type: secret
          label: { en-US: Merchant signing private key, zh-CN: 商户签名私钥 }
          required: true
          maximum_length: 32768
        - key: publicKey
          type: secret
          label: { en-US: UnionPay verification public key, zh-CN: 银联验签公钥 }
          required: true
          maximum_length: 32768
    methods: [capabilities.describe]
    provider_metadata:
      type: payment-method-contract
      version: v1
      values:
        providerCode: unionpay
        endpointOrigin: https://gateway.95516.com/gateway/api/frontTransReq.do
        modes: [unionpay_web, unionpay_wap]
        currencies: [CNY]
