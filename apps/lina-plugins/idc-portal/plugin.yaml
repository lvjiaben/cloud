# Stable plugin identity used by delivery, dependency, and asset governance.
id: idc-portal
name: IDC Website & Customer Center
version: v0.1.13
type: source
distribution: builtin
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Website package management, public API assembly, and customer-entry routing for the IDC operations platform
author: linapro
license: Proprietary

i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

dependencies:
  plugins:
    - id: idc-core
      version: ">=0.1.20 <1.0.0"

menus:
  - key: plugin:idc-portal:brand
    parent_key: setting
    name: Website Configuration
    path: /system/website-configuration
    component: system/plugin/dynamic-page
    icon: lucide:palette
    type: M
    sort: 95
    perms: idc:admin:portal:brand
    remark: Select an installed website plugin and configure website content
  - key: plugin:idc-portal:customer-external-menus
    parent_key: plugin:idc-core:catalog-products
    name: Member External Links
    path: /idc/customer-external-menus
    component: system/plugin/dynamic-page
    icon: lucide:panel-left
    type: M
    sort: 96
    visible: 0
    perms: idc:admin:portal:external-menu:view
    remark: Manage installation-level external links appended to the customer center menu
  - key: plugin:idc-portal:customer-external-menus:manage
    parent_key: plugin:idc-portal:customer-external-menus
    name: Manage customer center menus
    type: B
    visible: 0
    perms: idc:admin:portal:external-menu:manage

  - key: plugin:idc-portal:customer-template
    parent_key: setting
    name: Customer Center Configuration
    path: /system/customer-center-configuration
    component: system/plugin/dynamic-page
    icon: lucide:panels-top-left
    type: M
    sort: 96
    perms: idc:admin:portal:customer-template
    remark: Select a customer center template and configure its public brand

business_extensions:
  - point: website-template
    version: v1
    role: owner
    owner: idc-portal
    methods:
      - capabilities.describe
  - point: customer-template
    version: v1
    role: owner
    owner: idc-portal
    methods:
      - capabilities.describe
