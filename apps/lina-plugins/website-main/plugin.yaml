id: website-main
name: 官网
version: v0.4.6
type: dynamic
distribution: managed
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: 官网：展示网站资料、商品与内容，提供商品配置、报价和购物车入口，并衔接现有用户中心。
author: linapro
license: Proprietary
dependencies:
  plugins:
    - id: idc-portal
      version: ">=0.1.14 <1.0.0"
    - id: idc-core
      version: ">=0.1.0 <1.0.0"
public_assets:
  - source: frontend/public
    mount: /
    index: index.html
business_extensions:
  - point: website-template
    version: v1
    role: provider
    owner: idc-portal
    methods:
      - capabilities.describe
    interface_configuration_cardinality: singleton
    interface_configuration:
      version: v1
      fields:
        - key: herotitle
          type: single_line
          label:
            en-US: Home title
            zh-CN: 首页标题
          maximum_length: 120
        - key: herodescription
          type: single_line
          label:
            en-US: Home description
            zh-CN: 首页说明
          maximum_length: 500
        - key: heroimage
          type: single_line
          label:
            en-US: Home image URL
            zh-CN: 首页图片地址
          maximum_length: 2048
        - key: hero1href
          type: single_line
          label:
            en-US: First home slide button URL
            zh-CN: 首页第一张按钮地址
          maximum_length: 2048
        - key: relatedproductselectricity
          type: multi_line
          label:
            en-US: Related products for E-commerce solution
            zh-CN: 电商方案关联商品
          description:
            en-US: Paste one product page link from this website per line, up to 24, in display order. Leave blank to show no recommendations.
            zh-CN: 每行粘贴一个本方官网商品页面链接，最多24个，按行顺序展示；留空不推荐商品。
          maximum_length: 8192
        - key: relatedproductsweb
          type: multi_line
          label:
            en-US: Related products for Website solution
            zh-CN: 网站方案关联商品
          description:
