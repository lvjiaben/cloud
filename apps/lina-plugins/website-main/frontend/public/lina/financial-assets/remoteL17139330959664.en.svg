    <path d="M82 50h340v46H82Z" fill="#347cf5"/>
    <text x="252" y="80" fill="#fff" font-size="19" font-weight="700">Financial Services System</text>
    <g font-size="20">
      <rect x="270" y="112" width="210" height="84" rx="9" fill="#f7f9fc" stroke="#d4dce6"/><text x="375" y="163">Web Service</text>
      <rect x="615" y="112" width="210" height="84" rx="9" fill="#f7f9fc" stroke="#d4dce6"/><text x="720" y="163">App Service</text>
      <rect x="960" y="112" width="210" height="84" rx="9" fill="#f7f9fc" stroke="#d4dce6"/><text x="1065" y="163">Smart Business Hall</text>
    </g>

    <rect x="82" y="244" width="1276" height="172" fill="#fff" stroke="#cbd4df" stroke-width="2"/>
    <g font-size="20">
      <rect x="270" y="276" width="210" height="102" rx="9" fill="#f7f9fc" stroke="#d4dce6"/><text x="375" y="337">DDoS Protection</text>
      <rect x="615" y="276" width="210" height="102" rx="9" fill="#f7f9fc" stroke="#d4dce6"/><text x="720" y="337">Security Auditing</text>
