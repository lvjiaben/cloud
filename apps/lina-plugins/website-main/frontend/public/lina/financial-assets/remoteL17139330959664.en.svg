<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Financial services system</title>
  <desc id="desc">Web, mobile app and business hall services use security services and elastic load balancing to reach two application groups and a data services group.</desc>
  <defs>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#4389ff"/><stop offset="1" stop-color="#347cf5"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9aa7b7"/></marker>
    <g id="cloud" fill="#54a4f8">
      <path d="M-42 12c-13 0-23-10-23-22 0-11 9-20 20-22 5-18 22-31 42-31 18 0 34 11 41 27 16-2 30 10 30 26 0 13-10 22-23 22z"/>
      <path d="M-29 1h58" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-27" cy="1" r="3" fill="#25384e"/><circle cx="27" cy="1" r="3" fill="#25384e"/>
    </g>
  </defs>
  <rect width="1440" height="960" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#25384e" text-anchor="middle">
