    <path d="M720 222v18m0 176v24" stroke="#9aa7b7" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="82" y="448" width="1276" height="132" rx="8" fill="url(#blue)"/>
    <text x="720" y="526" fill="#fff" font-size="28" font-weight="700">Elastic Load Balancing</text>
    <path d="M720 580v44M720 624H250v24m470-24v24m0-24h470v24" fill="none" stroke="#cbd4df" stroke-width="3" marker-end="url(#arrow)"/>

