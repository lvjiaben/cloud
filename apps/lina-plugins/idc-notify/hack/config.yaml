            type: any
          plugin_idc_notify_delivery_task.marketing_consent_version:
            type: any
          plugin_idc_notify_delivery_task.marketing_preference_version:
            type: any
          plugin_idc_notify_delivery_task.marketing_quiet_hours_version:
            type: any
          plugin_idc_notify_delivery_task.marketing_evaluated_at:
            type: any
          plugin_idc_notify_delivery_task.provider_message_ref:
            type: any
          plugin_idc_notify_delivery_task.provider_query_deadline:
            type: any
          plugin_idc_notify_delivery_task.next_attempt_at:
