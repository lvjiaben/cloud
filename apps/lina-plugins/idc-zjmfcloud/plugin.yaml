          description: { en-US: "0 disables this feature.", zh-CN: "填0不开通且不收费。" }
          minimum: "0"
          maximum: "1000000"
        - key: nat_website_unlimited
          type: single_select
          label: { en-US: "Unlimited NAT websites", zh-CN: "共享建站不限量" }
          description: { en-US: "Select only for unlimited service; priced separately from quantity.", zh-CN: "需要不限量才选择，按不限量价格单独收费。" }
          static_candidates:
            - value: unlimited
              label: { en-US: Unlimited, zh-CN: 不限量 }
      conditions:
        - when: { operator: equal, field: snapshot_unlimited, value: unlimited }
          actions:
            - { action: hide, field: snapshot_count }
        - when: { operator: equal, field: backup_unlimited, value: unlimited }
          actions:
            - { action: hide, field: backup_count }
        - when: { operator: equal, field: nat_forward_unlimited, value: unlimited }
          actions:
            - { action: hide, field: nat_forward_count }
        - when: { operator: equal, field: nat_website_unlimited, value: unlimited }
          actions:
            - { action: hide, field: nat_website_count }
    provider_metadata:
      type: product-fulfillment-contract
      version: v1
      values:
        capability:
          enUS: ZJMFCloud server configuration with idc-resource-owned provisioning and ongoing management
          zhCN: 智简魔方云服务器配置，以及由 idc-resource 负责的开通和持续管理
        productChoiceFields: [port, system_disk_io_limit, data_disk_io_limit]
        customerProductFields: {memory_gib: memory}
        merchantCustomerFields: [node_priority, traffic_bill_type, system_disk_io_limit, data_disk_io_limit, network_type, port, system_read_mbps, system_write_mbps, system_read_iops, system_write_iops, data_read_mbps, data_write_mbps, data_read_iops, data_write_iops, cpu, memory_gib, system_disk, data_disk, bandwidth, ip_count, inbound_bandwidth, outbound_bandwidth, snapshot_count, snapshot_unlimited, backup_count, backup_unlimited, nat_forward_count, nat_forward_unlimited, nat_website_count, nat_website_unlimited]
        granularity: per_quantity_unit
        ongoingManagement: true
        renewalSupport: unsupported
        expiryManagement: unsupported
        entitlementOwnerId: idc-resource
        methodRoles:
          provision: provision
          query: query
  - point: resource-provider
    version: v1
    role: provider
    owner: idc-resource
    interface_configuration_cardinality: multiple
    interface_configuration:
      version: v1
      fields:
        - key: endpoint
          type: single_line
          label: { en-US: ZJMFCloud API endpoint, zh-CN: 魔方云接口地址 }
          required: true
          text_format: url
          maximum_length: 2048
        - key: username
          type: secret
          label: { en-US: API username, zh-CN: API 用户名 }
          required: true
        - key: password
          type: secret
          label: { en-US: API password, zh-CN: API 密码 }
          required: true
    methods:
      - connection.verify
      - capabilities.discover
      - configuration.candidates
      - provision.parameters.build
      - provider-capacity.list
      - operation.execute
      - task.query
      - resource.query
      - principal.lookup
      - principal.create
    provider_metadata:
      type: resource-provider-contract
      version: v1
      values:
        providerId: zjmfcloud-v1
        apiPathPrefix: /v1
        authenticationProfiles:
          profiles:
            default:
              strategy: login_session
              fields: { username: username, password: password }
              loginPath: /login
              tokenJSONPath: [$]
              tokenHeader: Access-Token
              sessionTTLSeconds: 3600

