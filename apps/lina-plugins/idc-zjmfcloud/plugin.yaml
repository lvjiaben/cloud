id: idc-zjmfcloud
name: IDC ZJMFCloud Provider
version: v0.3.21
type: dynamic
distribution: managed
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: Managed ZJMF public-cloud v1 connector for product configuration discovery and idc-resource-owned server execution.
author: linapro
license: Proprietary
i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文
dependencies:
  plugins:
    - id: vben-adapter
      version: "=0.1.0"
    - id: idc-core
      version: ">=0.1.85 <1.0.0"
    - id: idc-resource
      version: ">=0.1.73 <1.0.0"

business_extensions:
  - point: product-fulfillment
    version: v1
    role: provider
    owner: idc-core
    methods:
      - configuration.candidates
      - product.configuration.validate
      - provision
      - query
    product_configuration:
      version: v1
      fields:
        - key: region
          type: single_select
          label:
            en-US: Region
            zh-CN: 地区
          required: true
          dynamic_candidates:
            version: v1
            method: configuration.candidates
        - key: line
          type: single_select
          label:
            en-US: Network line
            zh-CN: 线路
          required: true
          dynamic_candidates:
            version: v1
            method: configuration.candidates
        - key: cpu
          type: integer
          label:
            en-US: CPU cores
            zh-CN: 处理器核心数
          required: true
          minimum: "1"
          maximum: "1024"
        - key: memory
          type: integer
          label:
            en-US: Memory (MiB)
            zh-CN: 内存（MiB）
          required: true
          minimum: "128"
          maximum: "1048576"
        - key: system_disk
          type: integer
          label:
            en-US: System disk (GiB)
            zh-CN: 系统盘（GiB）
          required: true
          minimum: "1"
          maximum: "1048576"
        - key: data_disk
          type: integer
          label:
            en-US: Data disk (GiB)
            zh-CN: 数据盘（GiB）
          required: true
          minimum: "0"
          maximum: "1048576"
        - key: bandwidth
          type: integer
          label:
            en-US: Bandwidth (Mbps)
            zh-CN: 带宽（Mbps）
          required: true
          minimum: "1"
          maximum: "1000000"
        - key: ip_count
          type: integer
          label: { en-US: "IPv4 addresses", zh-CN: "IPv4数量" }
          description: { en-US: "Leave blank to retain the package or channel default.", zh-CN: "留空沿用套餐或渠道默认值；填写后按此值开通。" }
          minimum: "0"
          maximum: "1024"
        - key: inbound_bandwidth
          type: integer
          label: { en-US: "Inbound bandwidth (Mbps)", zh-CN: "入站带宽（Mbps）" }
          description: { en-US: "Leave blank to retain the package or channel default.", zh-CN: "留空沿用套餐或渠道默认值；填写后按此值开通。" }
          minimum: "1"
          maximum: "1000000"
        - key: outbound_bandwidth
          type: integer
          label: { en-US: "Outbound bandwidth (Mbps)", zh-CN: "出站带宽（Mbps）" }
          description: { en-US: "Leave blank to retain the package or channel default.", zh-CN: "留空沿用套餐或渠道默认值；填写后按此值开通。" }
          minimum: "1"
          maximum: "1000000"
        - key: node_priority
          type: single_select
          label: { en-US: "Node selection priority", zh-CN: "节点选择优先级" }
          static_candidates:
            - value: "1"
              label: { en-US: "Fewest instances", zh-CN: "实例数量最少" }
            - value: "2"
              label: { en-US: "Lowest CPU load", zh-CN: "CPU负载最低" }
            - value: "3"
              label: { en-US: "Lowest memory usage", zh-CN: "内存占用最低" }
            - value: "4"
              label: { en-US: "Fill nodes in order", zh-CN: "按节点顺序填满" }
        - key: traffic_bill_type
          type: single_select
          label: { en-US: "Traffic reset cycle", zh-CN: "流量重置周期" }
          static_candidates:
            - value: month
              label: { en-US: "Calendar month", zh-CN: "每月一日重置" }
            - value: last_30days
              label: { en-US: "Service month", zh-CN: "按开通日每月重置" }
        - key: system_disk_io_limit
          type: single_line
          label: { en-US: "System disk performance", zh-CN: "系统盘性能" }
          description: { en-US: "Read MB/s, write MB/s, read IOPS, write IOPS. Example: 500,500,2000,2000. Zero means unlimited.", zh-CN: "依次填写读取MB/s、写入MB/s、读取IOPS、写入IOPS，例如500,500,2000,2000；0表示不限制。不要同时设置同一磁盘的单项性能限制。" }
          maximum_length: 43
        - key: data_disk_io_limit
          type: single_line
          label: { en-US: "Data disk performance", zh-CN: "数据盘性能" }
          description: { en-US: "Read MB/s, write MB/s, read IOPS, write IOPS. Example: 500,500,2000,2000. Zero means unlimited.", zh-CN: "依次填写读取MB/s、写入MB/s、读取IOPS、写入IOPS，例如500,500,2000,2000；0表示不限制。不要同时设置同一磁盘的单项性能限制。" }
          maximum_length: 43
        - key: network_type
          type: single_select
          label: { en-US: "Network type", zh-CN: "网络类型" }
          description: { en-US: "Leave blank to retain the package default. VPC creates a dedicated network for this server.", zh-CN: "留空沿用套餐默认；VPC会为此服务器创建独立网络。" }
          static_candidates:
            - value: normal
              label: { en-US: "Classic network", zh-CN: "经典网络" }
            - value: vpc
              label: { en-US: "Private network (VPC)", zh-CN: "私有网络（VPC）" }
        - key: port
          type: single_line
          label: { en-US: "Login port", zh-CN: "登录端口" }
          description: { en-US: "Enter 1–65535 or auto for a random port. Leave blank to retain the system default.", zh-CN: "填写1至65535，或auto表示随机端口；留空沿用系统默认。" }
          maximum_length: 5
        - key: system_read_mbps
          type: integer
          label: { en-US: "System disk read speed (MB/s)", zh-CN: "系统盘读取速度（MB/s）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: system_write_mbps
          type: integer
          label: { en-US: "System disk write speed (MB/s)", zh-CN: "系统盘写入速度（MB/s）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: system_read_iops
          type: integer
          label: { en-US: "System disk read IOPS (IOPS)", zh-CN: "系统盘读取IOPS（IOPS）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: system_write_iops
          type: integer
          label: { en-US: "System disk write IOPS (IOPS)", zh-CN: "系统盘写入IOPS（IOPS）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: data_read_mbps
          type: integer
          label: { en-US: "Data disk read speed (MB/s)", zh-CN: "数据盘读取速度（MB/s）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: data_write_mbps
          type: integer
          label: { en-US: "Data disk write speed (MB/s)", zh-CN: "数据盘写入速度（MB/s）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: data_read_iops
          type: integer
          label: { en-US: "Data disk read IOPS (IOPS)", zh-CN: "数据盘读取IOPS（IOPS）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: data_write_iops
          type: integer
          label: { en-US: "Data disk write IOPS (IOPS)", zh-CN: "数据盘写入IOPS（IOPS）" }
          description: { en-US: "0 removes this limit. Leave blank to retain the package or provider default.", zh-CN: "填0表示不限速；留空沿用套餐或上游默认。" }
          minimum: "0"
          maximum: "2147483647"
        - key: hostname_customer_input
          type: boolean
          label: { en-US: Allow customers to enter hostname, zh-CN: 允许客户填写主机名 }
          description: { en-US: Leave the customer input blank to generate automatically., zh-CN: 客户留空时自动生成。 }
        - key: password_customer_input
          type: boolean
          label: { en-US: Allow customers to enter password, zh-CN: 允许客户填写主机密码 }
          description: { en-US: Leave the customer input blank to generate automatically., zh-CN: 客户留空时自动生成。 }
        - key: hostname_prefix
          type: single_line
          label: { en-US: Hostname prefix, zh-CN: 主机名前缀 }
          description: { en-US: Up to 10 letters. Leave blank for automatic names., zh-CN: 最多10个英文字母，留空自动生成。 }
          maximum_length: 10
        - key: hostname_length
          type: integer
          label: { en-US: Hostname length, zh-CN: 主机名总长度 }
          description: { en-US: Includes the prefix. Leave blank to use the default., zh-CN: 包含前缀，留空使用默认规则。 }
          minimum: "4"
          maximum: "63"
        - key: hostname_characters
          type: multi_select
          label: { en-US: Hostname characters, zh-CN: 主机名允许字符 }
          static_candidates:
            - value: lowercase
              label: { en-US: Lowercase letters, zh-CN: 小写字母 }
            - value: digits
              label: { en-US: Numbers, zh-CN: 数字 }
        - key: password_length
          type: integer
          label: { en-US: Generated password length, zh-CN: 自动生成密码长度 }
          description: { en-US: Leave blank to use the default secure password., zh-CN: 留空使用默认安全密码。 }
          minimum: "6"
          maximum: "20"
        - key: password_characters
          type: multi_select
          label: { en-US: Password character rules, zh-CN: 密码字符规则 }
          description: { en-US: Each selected character type is required. Leave blank for letters and numbers., zh-CN: 每种选中的字符都会包含，留空使用大小写字母和数字。 }
          static_candidates:
            - value: lowercase
              label: { en-US: Lowercase letters, zh-CN: 小写字母 }
            - value: uppercase
              label: { en-US: Uppercase letters, zh-CN: 大写字母 }
            - value: digits
              label: { en-US: Numbers, zh-CN: 数字 }
            - value: symbols
              label: { en-US: Symbols, zh-CN: 特殊字符 }
