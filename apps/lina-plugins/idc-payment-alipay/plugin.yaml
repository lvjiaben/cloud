id: idc-payment-alipay
name: 支付宝支付
version: v0.1.0
type: dynamic
distribution: managed
scope_nature: platform_only
supports_multi_tenant: false
default_install_mode: global
description: 支付宝电脑网站与手机网站支付配置，由 IDC Payment 统一管理支付事实。
author: linapro
license: Proprietary
dependencies:
  plugins:
    - id: idc-payment
      version: ">=0.1.7 <1.0.0"
business_extensions:
  - point: payment-method
    version: v1
    role: provider
    owner: idc-payment
    interface_configuration_cardinality: multiple
    interface_configuration:
      version: v1
      fields:
        - key: merchantId
          type: single_line
          label: { en-US: Merchant account, zh-CN: 支付宝商户账号 }
          required: true
          maximum_length: 256
        - key: appId
          type: single_line
          label: { en-US: Application ID, zh-CN: 支付宝应用 ID }
          required: true
          maximum_length: 256
        - key: privateKey
          type: secret
          label: { en-US: Merchant RSA2 private key, zh-CN: 商户 RSA2 私钥 }
          required: true
          maximum_length: 32768
        - key: publicKey
          type: secret
          label: { en-US: Alipay RSA2 public key, zh-CN: 支付宝 RSA2 公钥 }
          required: true
          maximum_length: 32768
    methods: [capabilities.describe]
    provider_metadata:
      type: payment-method-contract
      version: v1
      values:
        providerCode: alipay
        endpointOrigin: https://openapi.alipay.com/gateway.do
        modes: [alipay_page, alipay_wap]
        currencies: [CNY]
