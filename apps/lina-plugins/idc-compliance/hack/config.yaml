      - link: "pgsql:idc_compliance_codegen:idc_compliance_codegen@tcp(127.0.0.1:5432)/idc_compliance_codegen?sslmode=disable"
        path: "internal"
        tables: >-
          plugin_idc_compliance_verification_case,
          plugin_idc_compliance_enterprise_encryption_key,
          plugin_idc_compliance_enterprise_material_upload,
