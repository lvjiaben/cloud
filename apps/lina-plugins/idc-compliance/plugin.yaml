  - key: plugin:idc-compliance:privacy:query
    parent_key: plugin:idc-core:compliance-governance
    name: View Privacy Governance
    path: /idc/compliance/privacy
    component: system/plugin/dynamic-page
    perms: idc:admin:compliance:privacy:query
    icon: lucide:shield-check
    type: M
    sort: 26
  - key: plugin:idc-compliance:privacy:configure
    parent_key: plugin:idc-compliance:privacy:query
